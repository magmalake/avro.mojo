[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "avro.mojo"
version = "0.1.0"
description = "Pure-Mojo Apache Avro — schemas, binary encoding, Object Container Files, and the codecs Apache Iceberg needs."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, no FFI, no external imports — consumers just `-I ../avro.mojo/src`.
test = { cmd = "mkdir -p build && mojo build tests/test_avro.mojo -I src -o build/avro-test && ./build/avro-test" }
bench = { cmd = "mkdir -p build && mojo build bench/bench_avro.mojo -I src -o build/avro-bench && ./build/avro-bench" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is avro-mojo; the Mojo import stays `from avro import …`.
[package]
name = "avro-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/avro"
name = "avro"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"

[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

[environments]
default = ["nightly"]
stable = ["stable"]
