[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "avro.mojo"
version = "0.4.3"
description = "Pure-Mojo Apache Avro — schemas, binary encoding, Object Container Files, and the codecs Apache Iceberg needs."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, no FFI. The one sibling is deflate.mojo (raw DEFLATE, also pure
# Mojo), so consumers need `-I ../avro.mojo/src -I ../deflate.mojo/src`.
test = { cmd = "mkdir -p build && mojo build tests/test_avro.mojo -I src -I tests -I ../deflate.mojo/src -o build/avro-test && ./build/avro-test" }
# The optional codecs (snappy, zstandard) pull in the sibling magmalake tins,
# so they live in their own environments: `pixi run -e codecs test-codecs`
# (nightly) and `-e codecs-stable` (stable 1.2.0). The sibling *sources* are
# on the include path — see the comment on [feature.codecs.dependencies].
test-codecs = { cmd = "mkdir -p build && mojo build tests/test_codecs.mojo -I src -I tests -I ../deflate.mojo/src -I ../snappy.mojo/src -I ../zstd.mojo/src -o build/avro-codecs-test && ./build/avro-codecs-test" }
# Interoperability the other way round: write a file per codec and have
# Python fastavro read it. Needs `uv` on PATH (it builds a throwaway venv).
crosscheck = { cmd = "bash tools/crosscheck.sh" }
# The schema-compiled cursor: its own suite, cross-checked against the Value
# path on the same files.
test-cursor = { cmd = "mkdir -p build && mojo build tests/test_cursor.mojo -I src -I tests -I ../deflate.mojo/src -o build/avro-cursor-test && ./build/avro-cursor-test" }

# mojolint (lint-mojo, below): the origin and threading mistakes the compiler
# lets through, with mojo-lsp-server behind the rules. Exit 1 on findings.
# The full tree (including src/avro_codecs, tests/test_codecs.mojo and
# tools/write_crosscheck.mojo) imports the sibling snappy.mojo/zstd.mojo
# tins — same -I list as `test-codecs` above.
lint = { cmd = "mojolint --lsp -I src -I tests -I ../deflate.mojo/src -I ../snappy.mojo/src -I ../zstd.mojo/src src tests tools" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is avro-mojo; the Mojo import stays `from avro import …`.
[package]
name = "avro-mojo"
version = "0.4.3"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/avro"
name = "avro"
# deflate-mojo arrives as a .mojopkg in the host prefix, and pixi-build-mojo
# does not put host dependencies on the Mojo import path by itself. Without
# this the package build fails with "unable to locate module 'deflate'" —
# only when a *consumer* installs the tin, never in this repo's own tasks,
# which compile the sibling from source.
extra-args = ["-I", "$PREFIX/lib/mojo"]

[package.host-dependencies]
mojo-compiler = "==1.2.0"
# Raw DEFLATE for the `deflate` block codec. Lived in this repo until
# 0.4.0; parquet.mojo and iceberg.mojo wanted it without wanting Avro.
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo", rev = "aeb571e54ac736b97c826a23f44501715fddc656" }

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = ">=1.2.0,<2"
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo", rev = "aeb571e54ac736b97c826a23f44501715fddc656" }

[feature.nightly.dependencies]
modular = ">=26.8.0.dev2026102305,<28"

[feature.stable.dependencies]
mojo-compiler = "==1.2.0"

# ── optional codecs ─────────────────────────────────────────────────────────
# The sibling tins come in as pixi *git source* dependencies, not path
# dependencies: a path dependency to ../zstd.mojo would break `pixi install`
# for anyone who cloned only this repo, because pixi solves every environment
# even when it installs just one.
#
# zstd.mojo is an FFI tin — this is what puts libzstd and its dlopen shim
# (libzstdmojo.so) into the environment. Both tins also install a
# `lib/mojo/*.mojopkg`, but those are built with stable Mojo 1.2.0 and the
# nightly compiler cannot load them, so `test-codecs` compiles the siblings
# from source with `-I ../snappy.mojo/src -I ../zstd.mojo/src` instead. CI
# checks the two repos out next to this one.
[feature.codecs.dependencies]
snappy-mojo = { git = "https://github.com/magmalake/snappy.mojo", rev = "b8172ed0a4ef13911cc225d46e26676a5b8f1ccd" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "53655623ca8585fd5b36b1239842913ec308ae69" }

# Benchmarks run through the shared harness (magmalake/bench.mojo) and get
# their own feature, so the tin stays out of the environments that run tests.
# -I $CONDA_PREFIX/lib/mojo is what puts its precompiled package on the import
# path. Stable only: a precompiled Mojo package is stamped with the compiler
# version that built it and refused by any other, and tins build with 1.2.0.
[feature.bench.dependencies]
deflate-mojo = { git = "https://github.com/magmalake/deflate.mojo", rev = "aeb571e54ac736b97c826a23f44501715fddc656" }
bench-mojo = { git = "https://github.com/magmalake/bench.mojo", rev = "7b6c423bbd9f31d3f126ca00e74994e08d64fe65" }

[feature.bench.tasks]
bench = "mkdir -p build && mojo build -I src -I $CONDA_PREFIX/lib/mojo bench/bench_avro.mojo -o build/bench-avro && ./build/bench-avro"
# The honesty reference: fastavro reading the very files `bench` wrote. It
# lives here because it depends on `bench`, which is only in this feature.
# Needs `uv` on PATH (it builds a throwaway venv under build/).
bench-fastavro = { cmd = "bash tools/bench_fastavro.sh", depends-on = ["bench"] }

[environments]
default = ["nightly"]
stable = ["stable"]
codecs = ["nightly", "codecs"]
codecs-stable = ["stable", "codecs"]
bench = ["stable", "bench"]

[dependencies]
# Added by `pixi shelf add lint-mojo`: the linter comes from GitHub as a pixi
# source dependency pinned at the revision mojoshelf published, and builds
# the `mojolint` executable into every environment next to mojo-lsp-server.
lint-mojo = { git = "https://github.com/magmalake/lint.mojo.git", rev = "5799cd56eca15ad142a9c8ba300ad45c5eca96f4" }
