name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # deflate.mojo (raw DEFLATE, pure Mojo) is checked out next to this repo
    # and put on the include path — the `deflate` block codec needs it. The
    # pixi git source dependency is what a *consumer* resolves; in CI the
    # sources are compiled directly, so the two toolchains can both build it.
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4
        with:
          path: avro.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and pixi changed how
          # it hashes git source dependencies after it, so a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          manifest-path: avro.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Unit tests
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} test

      - name: Cursor tests
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} test-cursor

  codecs:
    # The optional snappy / zstandard codecs. The sources are checked out next
    # to this repo and put on the include path; the pixi git source
    # dependencies are still what installs libzstd and its dlopen shim.
    # Stable only: the source build also drops a `.mojoc` compiled with 1.0.0
    # into the environment, and a nightly compiler refuses to load it
    # (`codecs` stays in pixi.toml for local use with a matching compiler).
    name: codecs stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [codecs-stable]
    steps:
      - uses: actions/checkout@v4
        with:
          path: avro.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/zstd.mojo
          path: zstd.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: avro.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Codec tests
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} test-codecs

      - name: Lint (mojolint --lsp)
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} lint
