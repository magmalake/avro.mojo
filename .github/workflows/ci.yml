name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A release PR (only versions, CHANGELOG.md, revs and locks change; see
  # tools/release_only.py in magmalake/.github) skips the macOS, nightly and
  # extra jobs below and runs a consumer build of the PR head instead. Every
  # other PR runs everything. The verdict is its own fast job because the jobs
  # below wait for it; the builds are the next one.
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true

  release-check:
    needs: release
    if: needs.release.outputs.release_only == 'true'
    uses: magmalake/.github/.github/workflows/release-check.yml@main
    permissions:
      contents: read
      pull-requests: read
    with:
      # The test legs below are skipped on release PRs, and the consumer build
      # is the check (the tests build against sibling checkouts (../deflate.mojo, ...)).
      task: ""

  test:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    # deflate.mojo (raw DEFLATE, pure Mojo) is checked out next to this repo
    # and put on the include path — the `deflate` block codec needs it. The
    # pixi git source dependency is what a *consumer* resolves; in CI the
    # sources are compiled directly, so the two toolchains can both build it.
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4
        with:
          path: avro.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: pixi.lock is written by this version, and pixi changed how
          # it hashes git source dependencies after it, so a newer pixi
          # rejects the committed lock with "lock file not up-to-date".
          pixi-version: v0.78.0
          manifest-path: avro.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Unit tests
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} test

      - name: Cursor tests
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} test-cursor

  codecs:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    # The optional snappy / zstandard codecs. The sources are checked out next
    # to this repo and put on the include path; the pixi git source
    # dependencies are still what installs libzstd and its dlopen shim.
    # Stable only: the source build also drops a `.mojoc` compiled with the
    # stable toolchain (1.2.0) into the environment, and a nightly compiler
    # refuses to load it — pixi builds a source dependency once and installs
    # the same artifact into every environment, so the two cannot differ
    # (prefix-dev/pixi#6940). `codecs` stays in pixi.toml for local use with a
    # matching compiler.
    name: codecs stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [codecs-stable]
    steps:
      - uses: actions/checkout@v4
        with:
          path: avro.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/deflate.mojo
          path: deflate.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/snappy.mojo
          path: snappy.mojo

      - uses: actions/checkout@v4
        with:
          repository: magmalake/zstd.mojo
          path: zstd.mojo

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          manifest-path: avro.mojo/pixi.toml
          environments: ${{ matrix.env }}

      - name: Codec tests
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} test-codecs

      - name: Lint (mojolint --lsp)
        working-directory: avro.mojo
        run: pixi run -e ${{ matrix.env }} lint

  # The one check to require: every job above passed or, on a release-only PR,
  # was skipped in favour of the release job's consumer build.
  ci:
    if: ${{ always() }}
    needs: [release, release-check, test, codecs]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          release = needs.pop("release")
          build = needs.pop("release-check", {"result": "skipped"})
          release_only = release["outputs"].get("release_only") == "true"
          ok = {"success", "skipped"} if release_only else {"success"}
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ok}
          for k, v in (("release", release), ("release-check", build)):
              if v["result"] not in ("success", "skipped"):
                  bad[k] = v["result"]
          print("release-only:", release_only, "results:", {k: v["result"] for k, v in needs.items()})
          if bad:
              sys.exit(f"did not succeed: {bad}")
          PY
