# Benchmarks, and the history behind
# https://magmalake.github.io/avro.mojo/benchmarks/
#
# The pipeline lives in magmalake/.github so every tin shares one copy: it runs
# `pixi run -e bench bench`, folds the report into this repo's gh-pages history,
# and republishes the dashboard. Pull requests run the benchmarks and publish
# nothing.
name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Benchmarks of a release PR ran on the PR that wrote the code (see
  # release-check.yml in magmalake/.github).
  release:
    if: github.event_name == 'pull_request'
    uses: magmalake/.github/.github/workflows/release-check.yml@release-check
    permissions:
      contents: read
      pull-requests: read
    with:
      classify-only: true
      tools-ref: "release-check"

  bench:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release_only != 'true' }}
    uses: magmalake/.github/.github/workflows/bench-report.yml@main
    permissions:
      contents: write
